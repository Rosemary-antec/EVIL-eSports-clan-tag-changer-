<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EVIL eSports Name Changer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #150E2A;
    --panel: #22173F;
    --panel-2: #2C1F52;
    --line: #3D2D6B;
    --text: #F3EEFF;
    --muted: #A99BD1;
    --pink: #FF4D8D;
    --pink-ink: #1A0B18;
    --cyan: #3DE1FF;
    --k: 1;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #150E2A; --panel: #22173F; --panel-2: #2C1F52; --line: #3D2D6B;
      --text: #F3EEFF; --muted: #A99BD1; --pink: #FF4D8D; --pink-ink: #1A0B18; --cyan: #3DE1FF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #150E2A; --panel: #22173F; --panel-2: #2C1F52; --line: #3D2D6B;
    --text: #F3EEFF; --muted: #A99BD1; --pink: #FF4D8D; --pink-ink: #1A0B18; --cyan: #3DE1FF;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }

  h1, .lede, .field > label, .field > .lab, .hint, .more h2, .more p { text-shadow: 0 1px 8px rgba(0,0,0,.85); }

  .bg-video {
    position: fixed; inset: -24px; width: calc(100% + 48px); height: calc(100% + 48px);
    object-fit: cover; z-index: -2;
    filter: blur(1.2px);
    background: #150E2A;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(21,14,42,.45) 0%, rgba(21,14,42,.62) 50%, rgba(21,14,42,.85) 100%);
  }
  .hero { text-align: center; margin: 0 0 30px; }
  .hero h1 {
    font-size: 1em; line-height: 1.15; margin: 0 0 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,.55);
  }
  .hero h1 span { display: block; }
  .hero h1 .l1 { font-size: clamp(56px, 21vw, 120px); color: var(--pink); }
  .hero h1 .l2 { font-size: clamp(32px, 12vw, 68px); color: #FFFFFF; margin-top: 10px; }
  .hero h1 .sub { font-size: clamp(15px, 4.6vw, 28px); color: #E7DFFF; margin-top: 18px; }
  .hero .lede { margin: 0 auto; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 28px 16px 56px; }

  h1 {
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: 18px;
    line-height: 1.5;
    margin: 0 0 10px;
    font-weight: 400;
    letter-spacing: 0;
  }
  .lede { margin: 0 0 24px; color: var(--muted); max-width: 44ch; }

  /* Name screen */
  .screen {
    position: relative;
    background: #0B0718;
    border: 3px solid var(--cyan);
    border-radius: 6px;
    padding: 28px 18px 18px;
    box-shadow: 6px 6px 0 var(--pink);
    overflow: hidden;
  }
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .plate {
    min-height: 92px;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    font-family: "Press Start 2P", "Segoe UI Symbol", "Courier New", monospace;
    font-size: calc(var(--fs, 24) * var(--k) * 1px);
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: #EFFCFF;
    text-shadow: 0 0 10px rgba(61,225,255,.55);
  }
  .plate .sym { color: #FF7DAE; text-shadow: 0 0 10px rgba(255,77,141,.6); }
  .plate .empty { color: #6C5F94; text-shadow: none; font-size: 0.6em; }
  .plate .cur {
    display: inline-block; width: 0.55em; height: 1em; margin-left: 0.25em;
    background: var(--cyan); vertical-align: -0.12em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .screen-foot {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 18px; flex-wrap: wrap;
  }
  .count { color: #A99BD1; font-size: 14px; }

  .btn-copy {
    font: inherit; font-weight: 700; font-size: 16px;
    background: var(--pink); color: var(--pink-ink);
    border: 0; border-radius: 4px;
    padding: 12px 22px; min-height: 48px;
    box-shadow: 4px 4px 0 var(--cyan);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .btn-copy:hover:not(:disabled) { transform: translate(1px, 1px); box-shadow: 3px 3px 0 var(--cyan); }
  .btn-copy:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--cyan); }
  .btn-copy:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn-copy.done { background: #FFC83D; color: #2A1D00; }

  /* Controls */
  .controls { margin-top: 36px; display: grid; gap: 26px; }
  .field > label, .field > .lab, legend {
    display: block; font-weight: 600; font-size: 15px; margin-bottom: 8px; padding: 0;
  }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }

  input[type="text"] {
    width: 100%;
    font: inherit; font-size: 18px; font-weight: 500;
    color: var(--text);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px; min-height: 50px;
  }
  input[type="text"]::placeholder { color: var(--muted); opacity: .8; }
  input[type="text"]:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 30%, transparent); }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
  .seg button {
    font: inherit; font-weight: 600; color: var(--muted);
    background: transparent; border: 0; padding: 12px 8px; min-height: 48px; cursor: pointer;
  }
  .seg button + button { border-left: 2px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--cyan); color: #06222A; }

  .switch { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 500; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track {
    width: 46px; height: 26px; border-radius: 4px; background: var(--panel-2); border: 2px solid var(--line);
    position: relative; flex: none; transition: background .15s;
  }
  .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 2px;
    background: var(--muted); transition: transform .15s, background .15s;
  }
  .switch input:checked + .track { background: color-mix(in srgb, var(--cyan) 35%, var(--panel-2)); border-color: var(--cyan); }
  .switch input:checked + .track::after { transform: translateX(20px); background: var(--cyan); }
  .switch input:focus-visible + .track { outline: 3px solid var(--cyan); outline-offset: 2px; }

  .tabs { display: flex; gap: 6px; margin: 12px 0 10px; flex-wrap: wrap; }
  .tabs button {
    font: inherit; font-weight: 600; font-size: 14px; color: var(--muted);
    background: transparent; border: 2px solid var(--line); border-radius: 4px;
    padding: 6px 14px; min-height: 38px; cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { color: var(--text); border-color: var(--pink); background: var(--panel); }

  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
  .chips.wide { grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); }
  .chip {
    font: inherit; font-size: 17px; font-weight: 500; color: var(--text);
    background: var(--panel); border: 2px solid var(--line); border-radius: 4px;
    min-height: 48px; padding: 6px; cursor: pointer;
    font-family: "Segoe UI Symbol", "Chakra Petch", system-ui, sans-serif;
    overflow: hidden; white-space: nowrap;
  }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: var(--pink); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--pink); }

  /* More styles list */
  .more h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .more p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .rows { display: grid; gap: 8px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left;
    font: inherit; color: var(--text);
    background: var(--panel); border: 2px solid var(--line); border-radius: 4px;
    padding: 10px 14px; min-height: 52px; cursor: pointer;
  }
  .row:hover { border-color: var(--cyan); }
  .row .txt { font-family: "Segoe UI Symbol", "Chakra Petch", system-ui, sans-serif; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
  .row .act { color: var(--muted); font-size: 14px; flex: none; }
  .row.done .act { color: var(--cyan); font-weight: 700; }

  button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

  .toast {
    position: fixed; left: 50%; transform: translate(-50%, 20px);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    background: #FFC83D; color: #2A1D00; font-weight: 700;
    padding: 10px 18px; border-radius: 4px; box-shadow: 4px 4px 0 var(--pink-ink);
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; max-width: 92vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 560px) {
    :root { --k: 1.5; }
    .wrap { padding-top: 48px; }
    h1 { font-size: 26px; }
    .screen { padding: 40px 28px 22px; }
    .plate { min-height: 120px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .plate .cur { animation: none; }
    .btn-copy, .toast, .track, .track::after { transition: none; }
  }
</style>
</head>

  <header class="hero">
    <h1><span class="l1">EVIL</span><span class="l2">eSports</span><span class="sub">name changer</span></h1>
    <p class="lede">Type your name, add the EVIL clan tag or a symbol, and copy the result straight into your game.</p>

  <section class="screen" aria-label="Your styled name">
    <div class="plate" id="plate" aria-live="polite"></div>
    <div class="screen-foot">
      <span class="count" id="count"></span>
      <button class="btn-copy" id="copyBtn" type="button">Copy name</button>
    </div>
  </section>

  <div class="controls">
    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" value="Electro" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your name">
    </div>

    <div class="field">
      <span class="lab" id="posLab">Where should the symbol go?</span>
      <div class="seg" role="group" aria-labelledby="posLab" id="pos">

        <button type="button" data-pos="after" aria-pressed="false">After</button>
        <button type="button" data-pos="both" aria-pressed="false">Both sides</button>
      </div>
      <p class="hint" style="margin-top:14px">
        <label class="switch"><input type="checkbox" id="space" checked><span class="track"></span>Space between symbol and name</label>
      </p>
    </div>

    <div class="field">
      <label for="char">Clan tag or symbol</label>
      <input type="text" id="char" value="[EVIL]" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your own, or pick one below">
      <div class="tabs" id="tabs" role="group" aria-label="Symbol groups"></div>
      <div class="chips" id="chips"></div>
      <p class="hint">Pairs like 【 】 switch to both sides automatically.</p>
    </div>

    <div class="more">
      <h2>Ready-made styles</h2>
      <p>Tap any style to copy it with your name.</p>
      <div class="rows" id="rows"></div>
    </div>
  </div>

    shapes: { label: "Shapes", items: ["★", "☆", "✦", "✧", "♛", "☠", "⚔", "⚡", "❖", "♦", "✪", "☯", "♞", "☬", "❤", "✿"] },
    pairs:  { label: "Pairs",  items: [["【","】"],["「","」"],["『","』"],["《","》"],["⟦","⟧"],["༺","༻"],["꧁","꧂"],["«","»"],["(",")"],["[","]"],["{","}"],["xX","Xx"],["★彡","彡★"],["-=","=-"]] },
    marks:  { label: "Marks",  items: ["_", "-", "~", "•", ".", "彡", "ッ", "ツ", "༒", "x", "oO", "//"] }
  };
  var STYLES = [
    ["【", "】"], ["★彡", "彡★"], ["xX_", "_Xx"], ["꧁", "꧂"], ["༺", "༻"],
    ["♛ ", " ♛"], ["⚡", "⚡"], ["「", "」"], ["-=", "=-"], ["◥ ", " ◤"], ["▄▀ ", " ▀▄"], ["•°¯`•• ", " ••´¯°•"]
  ];

  var state = { name: "Electro", char: "[EVIL]", closer: null, pos: "before", space: true, tab: "clan" };

  var $ = function (id) { return document.getElementById(id); };
  var plate = $("plate"), countEl = $("count"), copyBtn = $("copyBtn");
  var nameIn = $("name"), charIn = $("char"), spaceIn = $("space");
  var chipsEl = $("chips"), tabsEl = $("tabs"), rowsEl = $("rows"), toastEl = $("toast");

  function build() {
    var name = state.name.trim();
    if (!name) return { text: "", parts: [] };
    var ch = state.char, sp = state.space ? " " : "";
    var close = state.closer != null ? state.closer : ch;
    if (!ch) return { text: name, parts: [{ t: name }] };
    var parts;
    if (state.pos === "before") parts = [{ t: ch, s: 1 }, { t: sp }, { t: name }];
    else if (state.pos === "after") parts = [{ t: name }, { t: sp }, { t: ch, s: 1 }];
    else parts = [{ t: ch, s: 1 }, { t: sp }, { t: name }, { t: sp }, { t: close, s: 1 }];
    return { text: parts.map(function (p) { return p.t; }).join(""), parts: parts };
  }

  function sizeFor(n) {
    if (n <= 8) return 28;
    if (n <= 11) return 22;
    if (n <= 14) return 18;
    if (n <= 18) return 14;
    if (n <= 24) return 11;
    return 9;
  }

  function render() {
    var r = build();
    plate.textContent = "";
    if (!r.text) {
      var e = document.createElement("span");
      e.className = "empty"; e.textContent = "Type a name to start";
      plate.appendChild(e);
      countEl.textContent = "0 characters";
      copyBtn.disabled = true;
      plate.style.setProperty("--fs", 24);
    } else {
      r.parts.forEach(function (p) {
        if (!p.t) return;
        var s = document.createElement("span");
        if (p.s) s.className = "sym";
        s.textContent = p.t;
        plate.appendChild(s);
      });
      var cur = document.createElement("span");
      cur.className = "cur"; cur.setAttribute("aria-hidden", "true");
      plate.appendChild(cur);
      var n = Array.from(r.text).length;
      countEl.textContent = n + (n === 1 ? " character" : " characters");
      copyBtn.disabled = false;
      plate.style.setProperty("--fs", sizeFor(n));
    }
    renderRows();
  }

  function renderRows() {
    var name = state.name.trim() || "YourName";
    var existing = rowsEl.children;
    if (!existing.length) {
      STYLES.forEach(function (st, i) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "row"; b.dataset.i = i;
        var t = document.createElement("span"); t.className = "txt";
        var a = document.createElement("span"); a.className = "act"; a.textContent = "Copy";
        b.appendChild(t); b.appendChild(a);
        rowsEl.appendChild(b);
      });
    }
    Array.prototype.forEach.call(rowsEl.children, function (b, i) {
      b.firstChild.textContent = STYLES[i][0] + name + STYLES[i][1];
    });
  }

  function renderTabs() {
    tabsEl.textContent = "";
    Object.keys(SETS).forEach(function (k) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = SETS[k].label; b.dataset.tab = k;
      b.setAttribute("aria-pressed", String(state.tab === k));
      tabsEl.appendChild(b);
    });
  }

  function renderChips() {
    chipsEl.textContent = "";
    SETS[state.tab].items.forEach(function (it, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.dataset.i = i;
      var isPair = Array.isArray(it);
      b.textContent = isPair ? it[0] + " " + it[1] : it;
      b.setAttribute("aria-label", isPair ? "Pair " + it[0] + " and " + it[1] : "Symbol " + it);
      chipsEl.appendChild(b);
    });
    chipsEl.classList.toggle("wide", state.tab === "clan");
    updatePressed();
  }

  function updatePressed() {
    var items = SETS[state.tab].items;
    Array.prototype.forEach.call(chipsEl.children, function (b, i) {
      var it = items[i], on;
      if (Array.isArray(it)) on = state.char === it[0] && state.closer === it[1];
      else on = state.closer == null && state.char === it;
      b.setAttribute("aria-pressed", String(on));
    });
    Array.prototype.forEach.call($("pos").children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.pos === state.pos));
    });
  }

  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(text); });
    }
    return Promise.resolve(fallback(text));
  }
  function fallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.top = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  }

  // Events
  nameIn.addEventListener("input", function () { state.name = nameIn.value; render(); });

  charIn.addEventListener("input", function () {
    state.char = charIn.value; state.closer = null; updatePressed(); render();
  });

  spaceIn.addEventListener("change", function () { state.space = spaceIn.checked; render(); });

  $("pos").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.pos = b.dataset.pos; updatePressed(); render();
  });

  tabsEl.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.tab = b.dataset.tab; renderTabs(); renderChips();
  });

  chipsEl.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var it = SETS[state.tab].items[+b.dataset.i];
    if (Array.isArray(it)) { state.char = it[0]; state.closer = it[1]; state.pos = "both"; }
    else { state.char = it; state.closer = null; }
    charIn.value = state.char;
    updatePressed(); render();
  });

  copyBtn.addEventListener("click", function () {
    var text = build().text; if (!text) return;
    copyText(text).then(function (ok) {
      if (ok) {
        copyBtn.textContent = "Copied"; copyBtn.classList.add("done");
        toast("Copied " + text);
        setTimeout(function () { copyBtn.textContent = "Copy name"; copyBtn.classList.remove("done"); }, 1400);
      } else {
        toast("Copy blocked. Select the name and copy it manually.");
      }
    });
  });

  rowsEl.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var text = b.firstChild.textContent;
    copyText(text).then(function (ok) {
      if (!ok) { toast("Copy blocked. Select the name and copy it manually."); return; }
      b.classList.add("done"); b.lastChild.textContent = "Copied";
      toast("Copied " + text);
      setTimeout(function () { b.classList.remove("done"); b.lastChild.textContent = "Copy"; }, 1400);
    });
  });

  var bgv = $("bgv");
  if (bgv) {
    bgv.muted = true;
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { bgv.pause(); }
    else { var pl = bgv.play(); if (pl && pl.catch) pl.catch(function () {}); }
  }

  renderTabs(); renderChips(); render();
})();
</script>
</body>
</html>
